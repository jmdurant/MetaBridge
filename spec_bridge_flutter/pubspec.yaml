name: spec_bridge_flutter
description: Stream Meta Ray-Ban glasses video to Jitsi meetings
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.5

  # Navigation & Deep Linking
  go_router: ^17.0.1
  app_links: ^7.0.0

  # Jitsi Integration (lib-jitsi-meet via WebView)
  flutter_inappwebview: 6.2.0-beta.2

  # Local Storage
  shared_preferences: ^2.5.4

  # Permissions
  permission_handler: ^12.0.1

  # UI Components
  cupertino_icons: ^1.0.8

  # Utilities
  equatable: ^2.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# flutter_inappwebview 6.2.0-beta.2 declares `^1.4.0-beta.2` for its federated
# packages, but that caret range also pulls the newer, breaking *-beta.3 line
# (platform_interface 1.4.0-beta.3 added abstract methods 6.2.0-beta.2 doesn't
# implement). Since pubspec.lock isn't committed, pub floats these up and the
# build fails. Pin the whole federated set to the beta.2 line that 6.2.0-beta.2
# was built against. Remove if/when upgrading flutter_inappwebview itself.
dependency_overrides:
  flutter_inappwebview_platform_interface: 1.4.0-beta.2
  flutter_inappwebview_android: 1.2.0-beta.2
  flutter_inappwebview_ios: 1.2.0-beta.2
  flutter_inappwebview_macos: 1.2.0-beta.2
  flutter_inappwebview_web: 1.2.0-beta.2
  flutter_inappwebview_windows: 0.7.0-beta.2

flutter:
  uses-material-design: true

  assets:
    - assets/jitsi_bridge.html
    - assets/jitsi_bridge.js
