name: spec_bridge_flutter
description: Stream Meta Ray-Ban glasses video to Jitsi meetings
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.5+1

  # Navigation & Deep Linking
  go_router: ^18.1.0
  app_links: ^7.2.2

  # Jitsi Integration (lib-jitsi-meet via WebView)
  flutter_inappwebview: 6.2.0-beta.3

  # Local Storage
  shared_preferences: ^2.5.6

  # Permissions
  permission_handler: ^13.0.2

  # UI Components
  cupertino_icons: ^2.0.0

  # Utilities
  equatable: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/jitsi_bridge.html
    - assets/jitsi_bridge.js
    - assets/vendor/jitsi/
